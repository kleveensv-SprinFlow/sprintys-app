name: Build Android Dev Client

# Version de test : le téléphone affiche le code du PC en direct (Metro). À lancer à la main, une seule fois
# (puis seulement quand un outil natif est ajouté au projet). Lecture du code et dépôt du fichier construit seulement.
permissions:
  contents: read
  actions: write

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Dev Client APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-android

      - name: Install dependencies
        run: npm ci

      - name: Create .env file
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}" >> .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}" >> .env
          echo "EXPO_PUBLIC_REVENUECAT_IOS_KEY=${{ secrets.EXPO_PUBLIC_REVENUECAT_IOS_KEY }}" >> .env
          echo "EXPO_PUBLIC_REVENUECAT_ANDROID_KEY=${{ secrets.EXPO_PUBLIC_REVENUECAT_ANDROID_KEY }}" >> .env

      - name: Set build number
        run: node scripts/set-build-number.js $((100 + ${{ github.run_number }}))

      - name: Write google-services.json (server push notifications)
        if: ${{ vars.PUSH_ENABLED == '1' }}
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > google-services.json

      - name: Expo Prebuild (Generate Android Folder)
        env:
          PUSH_ENABLED: ${{ vars.PUSH_ENABLED }}
        run: npx expo prebuild -p android --no-install

      - name: Enable Gradle parallel and cache & JVM Tuning
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.parallel=true" >> ~/.gradle/gradle.properties
          echo "org.gradle.caching=true" >> ~/.gradle/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096M -Dkotlin.daemon.jvm.options\="-Xmx4096M"" >> ~/.gradle/gradle.properties

      - name: Restrict Architecture to arm64-v8a
        run: echo "reactNativeArchitectures=arm64-v8a" >> android/gradle.properties

      - name: Build Dev Client APK with Gradle
        working-directory: android
        env:
          NDK_CCACHE: ccache
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
        run: ./gradlew assembleDebug --build-cache

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-dev-client
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
