name: Build & Deploy to TestFlight

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Notes de version TestFlight (optionnel)'
        required: false
        default: 'Sprintflow TestFlight Beta'

jobs:
  build-ios:
    name: Build & Upload to TestFlight
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install npm dependencies
        run: npm ci

      - name: Create .env file
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}" >> .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}" >> .env

      - name: Expo Prebuild (Generate iOS Native Folder)
        run: npx expo prebuild -p ios --no-install

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Cache Fastlane Keychain
        uses: actions/cache@v4
        with:
          path: ~/Library/Keychains/ci_keychain-db
          key: fastlane-keychain-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            fastlane-keychain-${{ runner.os }}-

      - name: Prepare App Store Connect Auth Key
        run: |
          echo "${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}" > AuthKey.p8

      - name: Run Fastlane to Build & Upload to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          bundle exec fastlane ios beta

      - name: Upload IPA Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprintflow-ios-ipa
          path: build/Sprintflow.ipa
          retention-days: 30

      - name: Cleanup Secrets
        if: always()
        run: rm -f AuthKey.p8
