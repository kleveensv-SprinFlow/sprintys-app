name: Build Play Store AAB

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Notes de version (optionnel)'
        required: false
        default: 'Sprintflow Release'

jobs:
  build:
    name: Build & Sign AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-android-aab

      - name: Install dependencies
        run: npm ci

      - name: Create .env file
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}" >> .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}" >> .env

      - name: Expo Prebuild (Generate Android Folder)
        run: npx expo prebuild -p android --no-install

      - name: Configure Release Keystore & Signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          node scripts/configure-release-signing.js

      - name: Enable Gradle optimizations
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.parallel=true" >> ~/.gradle/gradle.properties
          echo "org.gradle.caching=true" >> ~/.gradle/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096M -Dkotlin.daemon.jvm.options\=\"-Xmx4096M\"" >> ~/.gradle/gradle.properties

      - name: Build Signed AAB with Gradle
        working-directory: android
        env:
          NDK_CCACHE: ccache
        run: ./gradlew bundleRelease --build-cache

      - name: Upload Signed AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sprintflow-playstore-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
